<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Tenses Exam - Class Mode</title>
<link rel="icon" type="image/png" href="Piece of Cake.png">
<meta name="theme-color" content="#07050f">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2300f0ff'/%3E%3Cstop%20offset='1'%20stop-color='%23ff2bd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath%20d='M0%200H52L64%2012V64H12L0%2052Z'%20fill='url(%23g)'/%3E%3Cpath%20d='M16%2017H48V26H36V50H28V26H16Z'%20fill='%2305030d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root{--font-body:"Rajdhani","Segoe UI",system-ui,sans-serif;--font-head:"Orbitron",sans-serif;--font-mono:"Share Tech Mono",Consolas,monospace;color-scheme:light dark;--bg:#f3f4fb;--card:#ffffff;--ink:#1b1f3b;--mut:#6a7090;--bd:#e4e6f3;--ac:#5b5bf0;--ac2:#a259ff;--ok:#16a34a;--okb:#dcfce7;--bad:#dc2626;--badb:#fee2e2;--selb:#ebebff;--sh:0 10px 30px rgba(60,60,140,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#171a31;--ink:#eef0ff;--mut:#9ba1c9;--bd:#272b4d;--ac:#8b8bff;--ac2:#c084fc;--ok:#4ade80;--okb:#12301f;--bad:#f87171;--badb:#3b1a1f;--selb:#23274d;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0e1020;--card:#171a31;--ink:#eef0ff;--mut:#9ba1c9;--bd:#272b4d;--ac:#8b8bff;--ac2:#c084fc;--ok:#4ade80;--okb:#12301f;--bad:#f87171;--badb:#3b1a1f;--selb:#23274d;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;background:var(--bg);overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35}
body::before{background:var(--ac);top:-140px;left:-120px}
body::after{background:var(--ac2);bottom:-160px;right:-120px}
main{max-width:920px;margin:0 auto;padding:24px 16px 60px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
button{font:inherit;color:inherit}

/* ============ BASE STYLES (page, buttons, theme button). Colours are overridden by the CYBERPUNK THEME at the bottom ============ */
.theme{position:fixed;top:12px;right:12px;z-index:20;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);box-shadow:var(--sh);cursor:pointer;font-size:1.1rem}

/* ============ HOME PAGE: title area and tense cards ============ */
.hero{text-align:center;padding:40px 0 44px}
.tag{display:inline-block;padding:6px 18px;border-radius:99px;background:var(--selb);color:var(--ac);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.hero h1{margin:18px 0 12px;font-size:clamp(2.5rem,9vw,4.6rem);line-height:1.02;letter-spacing:-.04em;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:480px;color:var(--mut);font-size:1.05rem}
.stats{display:flex;justify-content:center;gap:14px;margin-top:28px;flex-wrap:wrap}
.stats div{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 24px;box-shadow:var(--sh)}
.stats b{display:block;font-size:1.8rem;line-height:1.1;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{font-size:.8rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;padding:10px 0 60px}
.tc{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;min-height:310px;color:#fff;border-radius:30px;padding:26px;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 20px 40px -14px var(--c1);transition:transform .25s,box-shadow .25s;animation:bob 3.4s ease-in-out infinite alternate}
.tc:nth-child(even){animation-direction:alternate-reverse}
@keyframes bob{from{translate:0 -9px}to{translate:0 9px}}
@media (min-width:600px){.tc:nth-child(even){margin-top:48px}}
.tc::before{content:attr(data-n);position:absolute;right:-6px;top:-20px;font-size:8.5rem;font-weight:800;line-height:1;color:rgba(255,255,255,.2)}
.tc::after{content:"";position:absolute;left:-50px;bottom:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.tc:hover,.tc:focus-visible{transform:translateY(-8px) scale(1.03);box-shadow:0 30px 55px -14px var(--c1)}
.tc>*{position:relative;z-index:1}
.tc small{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;opacity:.85}
.tc h2{margin:58px 0 6px;font-size:1.75rem;line-height:1.15;letter-spacing:-.02em}
.tc p{margin:0 0 14px;opacity:.9;font-size:.95rem}
.tc em{font-style:normal;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 14px;font-size:.92rem;margin-bottom:20px}
.tc .row{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;font-weight:600}
.go{padding:8px 18px;border-radius:99px;background:#fff;color:var(--c1);font-weight:700}

/* ============ EXAM PAGE: top bar, questions, answers, results ============ */
.top{position:sticky;top:0;z-index:10;margin:0 -16px 18px;padding:12px 16px 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
.theme::before{content:"";display:block;width:18px;height:18px;margin:auto;border-radius:50%;border:2px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.th{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-right:48px}
.th b{font-size:1.1rem}.th small{color:var(--mut)}
.ghost,.btn{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 16px;cursor:pointer;font-weight:600;transition:transform .15s,box-shadow .15s}
.ghost:hover,.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.btn.p{border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none}
.bar{height:10px;background:var(--bd);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .3s}
.pct{font-size:.78rem;color:var(--mut);margin-top:4px;text-align:right}
.q{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:fade .35s ease both}
.q p{margin:0 0 14px;font-size:1.08rem;font-weight:500}
.n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;font-size:.82rem;font-weight:700;margin-right:10px}
.q u{display:inline-block;min-width:70px;border-bottom:3px dashed var(--c1);text-decoration:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--bd);background:var(--bg);border-radius:14px;padding:10px 12px;cursor:pointer;transition:all .15s}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--card);border:1px solid var(--bd);font-size:.8rem;font-weight:700;color:var(--mut)}
.opt:hover{border-color:var(--ac);transform:translateX(3px)}
.opt.sel{border-color:var(--ac);background:var(--selb);font-weight:600}
.opt.sel .l{background:var(--ac);color:#fff;border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:var(--okb);color:var(--ok);font-weight:600}
.opt.ok .l{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badb);color:var(--bad)}
.opt.bad .l{background:var(--bad);color:#fff;border-color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:38px;height:38px;border-radius:50%;padding:0}
.dot.full{border-color:var(--c1);color:var(--c1)}
.dot.on{color:#fff;border:0;background:linear-gradient(135deg,var(--c1),var(--c2))}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px 18px;margin-bottom:20px;box-shadow:var(--sh);animation:fade .5s ease}
.ring{--p:0;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--c1) calc(var(--p)*1%),var(--bd) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.9rem;font-weight:800}
.ring small{display:block;font-size:.8rem;color:var(--mut);font-weight:500;line-height:1}
.res h3{margin:14px 0 4px;font-size:1.3rem}
.res .b{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}

/* ============ TIMER: seven-segment clock (green / yellow / red) ============ */
.clock{--c1:#2ee86b;display:flex;align-items:center;gap:3px;flex:none;background:#0b0d1a;border:2px solid #23274d;border-radius:12px;padding:7px 12px;box-shadow:inset 0 0 12px rgba(0,0,0,.7),0 6px 16px -8px var(--c1)}
.clock.mid{--c1:#ffd21f}
.clock.low{--c1:#ff3b3b}
.sg{width:17px;height:30px}
.sg polygon{fill:rgba(255,255,255,.07)}
.sg .on{fill:var(--c1);filter:drop-shadow(0 0 3px var(--c1))}
.colon{display:flex;flex-direction:column;gap:9px;margin:0 3px}
.colon i{width:4px;height:4px;border-radius:50%;background:var(--c1);box-shadow:0 0 5px var(--c1);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
.clock.big{display:inline-flex;padding:16px 24px;gap:7px}
.clock.big .sg{width:36px;height:62px}
.clock.big .colon{gap:18px;margin:0 6px}
.clock.big .colon i{width:8px;height:8px}

/* ============ START SCREEN: rules and page picker ============ */
.intro{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:28px;padding:36px 20px;box-shadow:var(--sh);margin-top:22px;animation:fade .4s ease}
.intro h2{font-size:clamp(1.7rem,6vw,2.5rem);margin:14px 0 22px;letter-spacing:-.02em}
.intro ul{list-style:none;padding:0;margin:26px auto;max-width:380px;text-align:left;color:var(--mut)}
.intro li{padding:6px 0 6px 24px;position:relative}
.intro li::before{content:"";position:absolute;left:0;top:14px;width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.btn.big{padding:15px 44px;font-size:1.1rem;border-radius:16px}
.opt.lock{cursor:default}
.opt.lock:hover{transform:none;border-color:var(--bd)}
.opt.lock:not(.ok):not(.bad){opacity:.55}
.fb{margin-top:12px;font-weight:600;font-size:.9rem;padding:9px 13px;border-radius:12px;animation:fade .25s ease}
.fb.good{background:var(--okb);color:var(--ok)}
.fb.no{background:var(--badb);color:var(--bad)}
@media (max-width:520px){.th small{display:none}.sg{width:14px;height:25px}.clock{padding:6px 8px}}
.note{background:var(--badb);color:var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;animation:fade .3s ease}
.dot.todo{opacity:.45}
.dot:not([data-a]){cursor:default;transform:none!important;box-shadow:none!important}
.pkh{font-weight:700;color:var(--mut);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;margin-top:28px}
.pks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pk{border:2px solid var(--bd);background:var(--bg);border-radius:16px;padding:10px 16px;cursor:pointer;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s}
.pk small{color:var(--mut);font-size:.75rem}
.pk:hover{border-color:var(--c1);transform:translateY(-3px)}
.pk.on{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 22px -8px var(--c1)}
.pk.on small{color:rgba(255,255,255,.88)}
/* ---- header ---- */
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 58px 0 0;animation:down .8s cubic-bezier(.2,.9,.3,1) both}
.brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;letter-spacing:-.01em}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.2rem;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 20px -8px var(--ac);transform:rotate(-8deg)}
.navtag{color:var(--mut);font-size:.85rem;font-weight:600;padding:6px 14px;border:1px solid var(--bd);border-radius:99px;background:var(--card)}
.hero{position:relative;padding:34px 0 46px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:9px;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 10px transparent}}
.ul{position:relative;display:inline-block}
.ul::after{content:"";position:absolute;left:2%;right:2%;bottom:-4px;height:9px;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2),#ff6b9a);transform:scaleX(0);transform-origin:left;animation:line .9s cubic-bezier(.2,.9,.3,1) 1.3s forwards}
@keyframes line{to{transform:scaleX(1)}}
.cta{display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;margin-top:28px;animation:up .9s ease .75s both}
.clock.badge{gap:2px;padding:6px 14px}
.clock.badge small{color:#b4b9d6;font-size:.72rem;font-weight:600;margin-left:10px;letter-spacing:.06em;text-transform:uppercase}
.chip{position:absolute;padding:9px 18px;border-radius:99px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);font-weight:600;font-size:.92rem;animation:pop .7s cubic-bezier(.2,1.3,.4,1) .9s both,chipf 5s ease-in-out 1.6s infinite}
.k1{left:1%;top:20%;border-left:5px solid #22c55e}
.k2{right:-1%;top:30%;border-left:5px solid #3b82f6;animation-delay:1.05s,1.9s}
.k3{left:-1%;top:64%;border-left:5px solid #f97316;animation-delay:1.2s,2.2s}
.k4{right:2%;top:72%;border-left:5px solid #6366f1;animation-delay:1.35s,2.5s}
@keyframes chipf{0%,100%{translate:0 0}50%{translate:0 -12px}}
@media (max-width:920px){.chip{display:none}}
@media (max-width:520px){.navtag{padding:4px 9px;font-size:.72rem;white-space:nowrap}.brand{min-width:0;gap:6px}.brand b{font-size:.82rem;letter-spacing:.06em;white-space:nowrap}.nav{gap:8px}}
/* ---- first page animations ---- */
body::before{animation:drift 16s ease-in-out infinite alternate}
body::after{animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(70px,50px) scale(1.2)}}
.hero .tag{animation:down .8s cubic-bezier(.2,.9,.3,1) both}
.hero h1{background:linear-gradient(90deg,var(--ac),var(--ac2),#ff6b9a,var(--ac2),var(--ac));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:title 1.2s cubic-bezier(.2,.8,.2,1) .15s both,shimmer 5s ease-in-out 1.3s infinite alternate}
.hero p{animation:up .9s ease .55s both}
.stats div{animation:pop .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(.8s + var(--i,0)*130ms)}
@keyframes title{from{opacity:0;letter-spacing:.18em;filter:blur(14px);translate:0 24px}to{opacity:1;letter-spacing:-.04em;filter:blur(0);translate:0 0}}
@keyframes shimmer{to{background-position:100% 50%}}
@keyframes down{from{opacity:0;translate:0 -24px}to{opacity:1;translate:0 0}}
@keyframes up{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes pop{from{opacity:0;scale:.5;translate:0 24px}to{opacity:1;scale:1;translate:0 0}}
.tc{opacity:0;animation:none}
.tc.in{animation:enterU .95s cubic-bezier(.2,.9,.3,1.1) var(--d,0s) both,bobu 4.2s ease-in-out calc(.95s + var(--d,0s)) infinite}
.tc.in:nth-child(even){animation:enterD .95s cubic-bezier(.2,.9,.3,1.1) var(--d,0s) both,bobd 4.2s ease-in-out calc(.95s + var(--d,0s)) infinite}
@keyframes enterU{from{opacity:0;translate:0 -70px;scale:.8;rotate:-5deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}
@keyframes enterD{from{opacity:0;translate:0 90px;scale:.8;rotate:5deg}to{opacity:1;translate:0 0;scale:1;rotate:0deg}}
@keyframes bobu{0%,100%{translate:0 0}50%{translate:0 -11px}}
@keyframes bobd{0%,100%{translate:0 0}50%{translate:0 11px}}
.tc:hover,.tc:focus-visible{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px) scale(1.04)}
.tc::before{transition:transform .5s cubic-bezier(.2,.9,.3,1)}
.tc::after{transition:transform .6s cubic-bezier(.2,.9,.3,1)}
.tc:hover::before{transform:translate(-10px,8px) scale(1.12) rotate(-4deg)}
.tc:hover::after{transform:scale(1.5)}
.tc>.shine{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.4),transparent 55%)}
.tc:hover>.shine{opacity:1}
.go{transition:transform .25s,box-shadow .25s}
.tc:hover .go{transform:translateX(6px) scale(1.08);box-shadow:0 6px 14px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.tc{opacity:1!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ================= CYBERPUNK THEME =================
   CHANGE COLOURS HERE: --ac (main neon), --ac2 (second neon), --bg (background), --card (panels).
   :root.alt is the second palette used by the round button in the top-right corner. */
:root,:root:not([data-theme="light"]),:root[data-theme]{--font-body:"Rajdhani","Segoe UI",system-ui,sans-serif;--font-head:"Orbitron",sans-serif;--font-mono:"Share Tech Mono",Consolas,monospace;--bg:#07050f;--card:#0e0a20;--ink:#e6f7ff;--mut:#8f8ab8;--bd:#2b2060;--ac:#00f0ff;--ac2:#ff2bd6;--ok:#39ff88;--okb:rgba(57,255,136,.12);--bad:#ff3b6b;--badb:rgba(255,59,107,.14);--selb:rgba(0,240,255,.1);--sh:0 0 22px rgba(0,240,255,.12);color-scheme:dark}
:root.alt{--ac:#fcee09;--ac2:#ff2bd6;--selb:rgba(252,238,9,.1);--sh:0 0 22px rgba(252,238,9,.12)}
body{font-family:var(--font-body);font-weight:500;font-size:17px;background-color:var(--bg)}
body::before,body::after{opacity:.28}
h1,h2,h3,.brand,.th b,.go,.btn,.pk b,.clock small{font-family:var(--font-head)}
.tag,.navtag,.chip,.tc small,.tc em,.pct,.pkh,.stats span,.fb,.note{font-family:var(--font-mono)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:linear-gradient(var(--ac),var(--ac2))}
.theme{border-radius:0;border-color:var(--ac);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.theme::before{border-radius:0;transform:rotate(45deg);border-color:var(--ac);background:linear-gradient(90deg,var(--ac) 50%,transparent 50%)}
.logo{border-radius:0;color:#05030d;transform:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));box-shadow:none;font-family:var(--font-head)}
.brand b{text-transform:uppercase;letter-spacing:.12em;text-shadow:0 0 10px var(--ac)}
.navtag,.chip{border-radius:0;border-color:var(--ac);color:var(--ac);background:rgba(0,240,255,.05);box-shadow:none}
.chip{background:var(--card);color:var(--ink);border-width:1px 1px 1px 4px}
.tag{border-radius:0;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding:7px 24px;letter-spacing:.1em}
.hero h1{font-family:var(--font-head);font-weight:900;text-transform:uppercase;font-size:clamp(2rem,7.5vw,4rem);background:none;-webkit-background-clip:border-box;background-clip:border-box;color:#fff;animation:ctitle 1.2s cubic-bezier(.2,.8,.2,1) .15s both,glitch 4.5s steps(1) 1.6s infinite}
@keyframes ctitle{from{opacity:0;letter-spacing:.3em;filter:blur(10px)}to{opacity:1;letter-spacing:.02em;filter:blur(0)}}
@keyframes glitch{0%,90%,100%{text-shadow:3px 0 var(--ac2),-3px 0 var(--ac);translate:0 0}92%{text-shadow:-6px 0 var(--ac2),6px 0 var(--ac);translate:4px 0}94%{text-shadow:6px 0 var(--ac),-6px 0 var(--ac2);translate:-4px 0}96%{text-shadow:3px 0 var(--ac2),-3px 0 var(--ac);translate:0 0}}
.ul{color:var(--ac);text-shadow:0 0 14px var(--ac),0 0 36px var(--ac)}
.ul::after{height:5px;border-radius:0;box-shadow:0 0 14px var(--ac2)}
.hero p{font-size:1.15rem}
.stats div{border-radius:0;border-width:1px 1px 1px 3px;border-color:var(--bd);border-left-color:var(--ac);background:var(--card);box-shadow:none;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.stats b{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ac);font-family:var(--font-head);text-shadow:0 0 12px var(--ac)}
.btn,.ghost,.pk,.opt,.dot{border-radius:0;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
.btn,.ghost{border:1px solid var(--ac);background:color-mix(in srgb,var(--ac) 7%,transparent);color:var(--ac);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;font-weight:700}
.btn:hover,.ghost:hover{background:var(--ac);color:#05030d;box-shadow:none}
.btn.p{border:0;color:#05030d;background:linear-gradient(90deg,var(--ac),var(--ac2));font-weight:900}
.btn.p:hover{filter:brightness(1.2) saturate(1.2);color:#05030d}
.btn.big{font-size:1rem;padding:15px 40px}
.dot{width:42px;height:40px;padding:0}
.dot.on{color:#05030d;background:linear-gradient(135deg,var(--c1),var(--c2))}
.dot.full{border-color:var(--c1);color:var(--c1)}
.tc{border-radius:0;color:var(--ink);border:2px solid transparent;background:linear-gradient(160deg,#130d2c,#09061a) padding-box,linear-gradient(135deg,var(--c1),var(--c2)) border-box;box-shadow:inset 0 0 40px color-mix(in srgb,var(--c1) 16%,transparent);clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.tc:hover,.tc:focus-visible{box-shadow:inset 0 0 70px color-mix(in srgb,var(--c1) 34%,transparent)}
.tc::before{color:transparent;-webkit-text-stroke:1px color-mix(in srgb,var(--c1) 60%,transparent);font-family:var(--font-head)}
.tc::after{left:0;right:0;top:-40%;bottom:auto;width:auto;height:34%;border-radius:0;background:linear-gradient(transparent,color-mix(in srgb,var(--c1) 22%,transparent),transparent);animation:scan 3.6s linear infinite}
.tc:hover::after{transform:none}
/* @keyframes scan{to{top:115%}} */
.tc small{color:var(--c2);opacity:1;letter-spacing:.14em}
.tc small::before{content:"// "}
.tc h2{font-size:1.3rem;text-transform:uppercase;letter-spacing:.06em;color:var(--c1);text-shadow:0 0 14px var(--c1)}
.tc p{opacity:1;color:var(--mut)}
.tc em{border-radius:0;background:rgba(255,255,255,.04);border:1px solid color-mix(in srgb,var(--c1) 40%,transparent);border-left:3px solid var(--c1);backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink)}
.tc .row{font-family:var(--font-mono);color:var(--mut)}
.go{border-radius:0;background:var(--c1);color:#05030d;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding:9px 20px}
.top{background:rgba(7,5,15,.85);border-bottom:1px solid var(--ac);box-shadow:0 6px 20px -10px var(--ac)}
.th b{text-transform:uppercase;letter-spacing:.08em;text-shadow:0 0 10px var(--c1)}
.bar{border-radius:0;height:8px;background:#1a1340}
.bar i{border-radius:0;box-shadow:0 0 12px var(--c1)}
.q,.intro,.res{border-radius:0;border:1px solid var(--bd);border-left:3px solid var(--c1);box-shadow:none;background:var(--card);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
.q p{font-weight:600}
.n{border-radius:0;color:#05030d;font-family:var(--font-mono);font-weight:700;clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,0 100%)}
.q u{border-bottom:3px solid var(--c1);box-shadow:0 4px 10px -4px var(--c1)}
.opt{border:1px solid var(--bd);background:rgba(255,255,255,.03);font-weight:600}
.opt .l{border-radius:0;font-family:var(--font-mono)}
.opt:hover{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,transparent)}
.opt.ok{border-color:var(--ok);text-shadow:0 0 10px var(--ok);box-shadow:inset 0 0 18px rgba(57,255,136,.18)}
.opt.bad{border-color:var(--bad);text-shadow:0 0 10px var(--bad);box-shadow:inset 0 0 18px rgba(255,59,107,.18)}
.fb,.note{border-radius:0;border-left:3px solid currentColor}
.intro h2,.res h3{text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 14px var(--c1)}
.pk{border:1px solid var(--bd);background:rgba(255,255,255,.03)}
.pk.on{color:#05030d;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:none}
.ring{background:conic-gradient(var(--c1) calc(var(--p)*1%),#1a1340 0);filter:drop-shadow(0 0 12px var(--c1))}
.ring div{font-family:var(--font-head);color:var(--c1)}
.clock{border-radius:2px;border-color:#241a5a;background:#05030d}
.clock .sg .on,.clock .colon i{filter:drop-shadow(0 0 5px var(--c1))}

/* ================= MOBILE ================= */
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
@media (hover:none){
  .tc:hover,.tc:focus-visible{transform:none}
  .tc::after{display:none}
  .opt:hover,.pk:hover,.btn:hover,.ghost:hover{transform:none}
  .btn:hover,.ghost:hover{background:color-mix(in srgb,var(--ac) 7%,transparent);color:var(--ac)}
  .btn.p:hover{color:#05030d;filter:none}
}
@media (max-width:640px){
  body{font-size:16px}
  body::before,body::after{width:260px;height:260px;filter:blur(60px)}
  main{padding:12px max(14px,env(safe-area-inset-right)) 28px max(14px,env(safe-area-inset-left))}
  .theme{top:calc(8px + env(safe-area-inset-top));right:8px;width:38px;height:38px}
  .nav{padding-right:48px}
  .logo{width:34px;height:34px;font-size:1rem}
  .brand{font-size:1rem}
  .hero{padding:22px 0 28px}
  .hero h1{font-size:clamp(1.4rem,6.8vw,2rem);letter-spacing:.01em}
  .hero p{font-size:1rem}
  .cta{flex-direction:column;gap:14px;margin-top:20px}
  .cta .btn.big{width:100%;max-width:340px}
  .stats{gap:8px;margin-top:22px}
  .stats div{flex:1 1 90px;padding:10px 12px}
  .stats b{font-size:1.4rem}
  .grid{grid-template-columns:1fr;gap:18px;padding-bottom:30px}
  .tc{min-height:250px;padding:22px}
  .tc::before{font-size:6.5rem}
  .tc h2{margin:40px 0 6px;font-size:1.15rem}
  /* exam top bar */
  .top{margin:0 -14px 14px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
  .th{gap:8px;padding-right:44px;margin-bottom:8px}
  .th b{font-size:.95rem}
  .th .ghost{padding:8px 10px;font-size:.72rem}
  .pct{font-size:.7rem}
  /* questions */
  .q{padding:14px}
  .q p{font-size:1rem;margin-bottom:12px}
  .opts{grid-template-columns:1fr;gap:8px}
  .opt{min-height:50px;font-size:1rem;padding:10px 12px}
  /* bottom navigation stays on screen */
  .foot{position:sticky;bottom:0;z-index:9;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px -14px 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(7,5,15,.94);border-top:1px solid var(--ac);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .foot>span{display:none}
  .foot>span:first-child~.btn{grid-column:auto}
  .foot>.clock{justify-self:center;align-self:center}
  .foot>.btn{width:100%;min-height:46px}
  .dots{grid-column:1/-1;order:-1;justify-content:center;gap:6px}
  .dot{width:40px;height:38px}
  /* start screen */
  .intro{padding:26px 14px;margin-top:14px}
  .clock.big{padding:12px 14px}
  .clock.big .sg{width:28px;height:48px}
  .pks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pk:first-child{grid-column:1/-1}
  .pk{min-width:0;padding:10px 4px}
  .pk b{font-size:.78rem}
  .intro .btn.big{width:100%}
  .intro ul{font-size:.95rem}
  /* results */
  .res{padding:20px 14px}
  .ring{width:128px;height:128px}
  .ring div{width:100px;height:100px;font-size:1.6rem}
  .res .b .btn{flex:1 1 140px}
}
@media (max-width:360px){.th b{display:none}.hero h1{font-size:1.35rem}}

/* ================= SMALL PHONES (about 380px wide) ================= */
@media (max-width:400px){
  main{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .tag{display:inline-block;max-width:100%;font-size:.66rem;line-height:1.35;letter-spacing:.04em;padding:7px 14px}
  .hero{padding:18px 0 24px}
  .hero h1{font-size:clamp(1.2rem,5.9vw,1.55rem);letter-spacing:0}
  .hero p{font-size:.95rem}
  .stats b{font-size:1.25rem}
  .stats span{font-size:.7rem}
  .tc{padding:20px;min-height:235px}
  .tc h2{font-size:1.05rem;margin-top:34px}
  .tc p{font-size:.9rem}
  .tc em{font-size:.84rem;padding:9px 11px}
  .top{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .th{gap:6px}
  .th .ghost{padding:8px 9px}
  .th b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9rem}
  .clock{padding:5px 7px}
  .sg{width:13px;height:23px}
  .colon{gap:7px;margin:0 2px}
  .colon i{width:3px;height:3px}
  .pct{font-size:.66rem}
  .q{padding:12px}
  .q p{font-size:.98rem}
  .n{width:26px;height:26px;margin-right:8px}
  .opt{font-size:.95rem;padding:9px 10px;gap:8px}
  .foot{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
  .dot{width:38px}
  .intro{padding:22px 12px}
  .intro h2{font-size:1.35rem;margin-bottom:16px}
  .pk b{font-size:.74rem}
  .pk small{font-size:.66rem}
  .btn.big{padding:14px 18px;font-size:.88rem}
  .clock.big{padding:10px 12px}
  .clock.big .sg{width:26px;height:44px}

}

/* ================= START PRACTISING BUTTON ================= */
.cta-wrap{display:inline-block;filter:drop-shadow(0 0 12px var(--ac))}
.cta-btn{all:unset;box-sizing:border-box;position:relative;overflow:hidden;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:16px;padding:19px 38px;font-family:var(--font-head);font-weight:900;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:#05030d;background:linear-gradient(90deg,var(--ac),var(--ac2));clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));transition:transform .2s,filter .2s;-webkit-tap-highlight-color:transparent}
.cta-a{display:inline-block;font-size:1.3rem;line-height:1;animation:ctanudge 1.3s ease-in-out infinite}
@keyframes ctanudge{50%{transform:translateX(7px)}}
.cta-btn:hover{transform:scale(1.06);filter:brightness(1.12)}
.cta-btn:active{transform:scale(.96)}
.cta-btn:focus-visible{outline:2px solid #fff;outline-offset:-6px}
@media (max-width:640px){.cta .cta-wrap{width:100%;max-width:340px}.cta-btn{width:100%;padding:17px 18px;font-size:.88rem;letter-spacing:.1em}}
@media (hover:none){.cta-btn:hover{transform:none;filter:none}}

/* ================= START BUTTON (second page) ================= */
.intro .cta-wrap{display:block;width:100%;max-width:380px;margin:6px auto 0}
.intro .cta-btn{width:100%}
.start-btn{justify-content:space-between;padding:16px 30px}
.st{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.st b{font-size:1.05rem;letter-spacing:.12em}
.st small{font-family:var(--font-mono);font-size:.7rem;font-weight:400;letter-spacing:.05em;text-transform:none;opacity:.8}
@media (max-width:400px){.start-btn{padding:14px 20px}.st b{font-size:.92rem;letter-spacing:.08em}}

/* ---- logo picture (your PNG) ---- */
.logo img{display:block;width:100%;height:100%;object-fit:contain}
.logo:has(img){background:none;clip-path:none;box-shadow:none;width:60px;height:60px}
@media (max-width:640px){.logo:has(img){width:60px;height:60px}}
@media (max-width:400px){.logo:has(img){width:60px;height:60px}}
/* ---- two-letter logo ---- */
.logo{font-size:.95rem;letter-spacing:-.02em}
@media (max-width:640px){.logo{font-size:.8rem}}

/* ================= BOTTOM CLOCK (next to Next / Submit) ================= */
.foot .clock{
  position:relative;gap:4px;padding:8px 16px 8px 14px;border:2px solid transparent;border-radius:0;
  background:linear-gradient(#05030d,#05030d) padding-box,linear-gradient(135deg,var(--c1),var(--c2,var(--ac2))) border-box;
  clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));
  box-shadow:inset 0 0 18px color-mix(in srgb,var(--c1) 28%,transparent);
  transition:box-shadow .3s}
.foot .clock::before{content:"TIME";align-self:stretch;display:flex;align-items:center;margin-right:8px;padding-right:10px;border-right:1px solid color-mix(in srgb,var(--c1) 45%,transparent);font-family:var(--font-mono);font-size:.62rem;letter-spacing:.2em;color:var(--c1);opacity:.85;writing-mode:vertical-rl;transform:rotate(180deg)}
.foot .clock.low{animation:clockwarn 1s ease-in-out infinite}
@keyframes clockwarn{50%{box-shadow:inset 0 0 30px color-mix(in srgb,var(--c1) 70%,transparent)}}
@media (min-width:641px){.foot .clock .sg{width:20px;height:36px}.foot .clock .colon{gap:11px}}
@media (max-width:640px){.foot .clock{padding:6px 10px 6px 8px}.foot .clock::before{margin-right:6px;padding-right:7px;font-size:.55rem}}

/* ================= SEARCH BAR (home page) ================= */
.cta{margin-top:30px}
.search{position:relative;display:flex;align-items:center;gap:12px;width:100%;max-width:520px;padding:0 16px;height:58px;border:2px solid transparent;
  background:linear-gradient(#05030d,#05030d) padding-box,linear-gradient(90deg,var(--ac),var(--ac2)) border-box;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 0 22px color-mix(in srgb,var(--ac) 14%,transparent);transition:box-shadow .25s,filter .25s}
.search:focus-within{box-shadow:inset 0 0 30px color-mix(in srgb,var(--ac) 32%,transparent);filter:drop-shadow(0 0 10px var(--ac))}
.search svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--ac);stroke-width:2.4;stroke-linecap:round;filter:drop-shadow(0 0 5px var(--ac))}
.search input{all:unset;flex:1;min-width:0;height:100%;font-family:var(--font-mono);font-size:1.05rem;letter-spacing:.04em;color:var(--ink)}
.search input::placeholder{color:var(--mut)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.search kbd{flex:none;font-family:var(--font-mono);font-size:.8rem;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);padding:2px 9px}
@media (hover:none){.search kbd{display:none}}
.tc[hidden]{display:none}
.grid.filtered .tc:nth-child(even){margin-top:0}
.none{text-align:center;color:var(--mut);font-family:var(--font-mono);padding:10px 0 60px}
.none[hidden]{display:none}
@media (max-width:640px){.cta{margin-top:20px}.search{height:52px;max-width:none}.search input{font-size:1rem}}

/* ---- laptop: keep the bottom bar (with the clock) on screen while scrolling ---- */
@media (min-width:641px){
  .foot{position:sticky;bottom:0;z-index:9;margin:20px -16px 0;padding:10px 16px;background:rgba(7,5,15,.94);border-top:1px solid var(--ac);box-shadow:0 -6px 20px -10px var(--ac);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
}

/* ---- card corner: your picture instead of the big number (01-12) ---- */
.tc::before{content:"";width:8.5rem;height:8.5rem;top:-6px;right:-4px;-webkit-text-stroke:0;background:url("Piece%20of%20Cake.png") center/contain no-repeat;opacity:.6;filter:drop-shadow(0 0 10px var(--c1))}
@media (max-width:640px){.tc::before{width:6.5rem;height:6.5rem}}

/* ================= CARD CLICK ANIMATION ================= */
.tc.pick{animation:pickpop .56s cubic-bezier(.3,1.4,.5,1) forwards!important;z-index:5}
@keyframes pickpop{0%{scale:1;rotate:0deg}30%{scale:.94;rotate:-1deg}100%{scale:1.1;rotate:1.5deg;opacity:1}}
.grid.leaving .tc:not(.pick){animation:fadeaway .4s ease forwards!important;pointer-events:none}
@keyframes fadeaway{to{opacity:0;scale:.88;filter:blur(4px)}}
.wipe{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:all;
  background:linear-gradient(135deg,var(--c1),var(--c2));clip-path:circle(0 at var(--x) var(--y));
  animation:wipein .56s cubic-bezier(.6,.05,.3,1) forwards}
.wipe span{font-family:var(--font-head);font-weight:900;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(1.3rem,5vw,2.6rem);text-align:center;padding:0 20px;color:#05030d;opacity:0;animation:wipetxt .56s ease .2s forwards}
.wipe.out{animation:wipeout .5s ease forwards;clip-path:circle(160vmax at var(--x) var(--y))}
@keyframes wipein{to{clip-path:circle(160vmax at var(--x) var(--y))}}
@keyframes wipetxt{to{opacity:1;letter-spacing:.2em}}
@keyframes wipeout{to{opacity:0}}

/* ================= SECOND PAGE (start screen) ANIMATION ================= */
.intro.enter>*{animation:up .65s cubic-bezier(.2,.9,.3,1) both}
.intro.enter>:nth-child(1){animation-delay:.05s}.intro.enter>:nth-child(2){animation-delay:.12s}
.intro.enter>:nth-child(3){animation-delay:.2s;animation-name:pop}.intro.enter>:nth-child(4){animation-delay:.3s}
.intro.enter>:nth-child(5){animation-delay:.36s}.intro.enter>:nth-child(6){animation-delay:.46s}
.intro.enter>:nth-child(7){animation-delay:.55s}
.pk{transition:all .2s,scale .2s}.pk:active{scale:.94}
.cta-btn.pressed{animation:pickpop .5s cubic-bezier(.3,1.4,.5,1) forwards}

/* last page has no Submit button: the clock stands alone and the exam ends when it reaches 00:00 */
@media (max-width:640px){.foot>.clock:last-child{grid-column:1/-1;justify-self:center}}

/* ================= SECOND PAGE: BETTER LAYOUT ================= */
.intro{max-width:780px;margin:22px auto 0;padding:40px 28px 34px;
  background:radial-gradient(ellipse 70% 220px at 50% 0,color-mix(in srgb,var(--c1) 20%,transparent),transparent 70%),var(--card)}
.intro h2{font-size:clamp(1.5rem,5.4vw,2.6rem);margin:16px 0 8px;line-height:1.1}
.intro .sub{margin:0 auto 16px;max-width:460px;color:var(--mut);font-size:1.1rem}
.exq{display:inline-block;max-width:100%;padding:10px 18px;font-family:var(--font-mono);font-size:.98rem;color:var(--ink);background:rgba(255,255,255,.04);border:1px solid color-mix(in srgb,var(--c1) 40%,transparent);border-left:3px solid var(--c1)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px auto 22px;max-width:520px}
.mini div{padding:12px 6px;background:rgba(255,255,255,.03);border:1px solid var(--bd);border-top:2px solid var(--c1);clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.mini b{display:block;font-family:var(--font-head);font-size:1.9rem;line-height:1.1;color:var(--c1);text-shadow:0 0 14px var(--c1)}

<script>
/* =====================================================================
   HOW THIS FILE IS ORGANISED  (search for the numbers below)

   4. QUESTIONS  - builds the 50 questions of a tense

/* ---------- 1. SETTINGS ---------- */
const CONFIG={
  pages:5,                 // pages in one exam

  redAtPercent:30,         // timer is RED when this % (or less) of the time is left

/* ---------- 2. WORDS ---------- */
const SUBJECTS=["I","You","He","She","We","They"];
// Each verb row: [base, he/she form, -ing form, past, past participle, rest of the sentence]
// To add a verb, add a new row. More verbs = more different questions.
const VERBS=[
["play","plays","playing","played","played","football"],
["watch","watches","watching","watched","watched","TV"],
["study","studies","studying","studied","studied","English"],
["cook","cooks","cooking","cooked","cooked","dinner"],
["write","writes","writing","wrote","written","a letter"],
["read","reads","reading","read","read","a book"],
["drink","drinks","drinking","drank","drunk","tea"],

["clean","cleans","cleaning","cleaned","cleaned","the room"],
["visit","visits","visiting","visited","visited","the museum"],

["swim","swims","swimming","swam","swum","in the lake"],
["build","builds","building","built","built","a house"],
["teach","teaches","teaching","taught","taught","grammar"],
["catch","catches","catching","caught","caught","the bus"],

["tell","tells","telling","told","told","a story"],
["send","sends","sending","sent","sent","an email"],

{id:"fs",  name:"Future Simple",   c1:"#00f0ff",c2:"#9dff00",d:"Predictions and decisions with will.",ex:"He will play football tomorrow.",t:["tomorrow","next week","next year","soon"],f:(s,v)=>"will "+v[0]},
{id:"ppc", name:"Present Perfect Continuous",c1:"#00ffa3",c2:"#00b3ff",d:"Actions that started in the past and continue until now.",ex:"She has been playing football for two hours.",t:["for two hours","all day long","since early morning"],f:(s,v)=>has(s)+" been "+v[2]},
{id:"pap", name:"Past Perfect",    c1:"#ff6ec7",c2:"#7a5cff",d:"An action finished before another past action.",ex:"He had played football before it rained.",t:["before the teacher arrived","before I called","by the time we got there"],f:(s,v)=>"had "+v[4]},
{id:"papc",name:"Past Perfect Continuous",c1:"#ffe600",c2:"#ff8a00",d:"A longer action in progress before a past moment.",ex:"She had been playing for two hours before it rained.",t:["for two hours before the rain stopped","all day before he arrived","for a long time before she left"],f:(s,v)=>"had been "+v[2]},
{id:"fc",  name:"Future Continuous",c1:"#00e5ff",c2:"#2979ff",d:"Actions in progress at a time in the future.",ex:"He will be playing football at 8 tomorrow.",t:["at 8 tomorrow","this time tomorrow","at noon next Monday"],f:(s,v)=>"will be "+v[2]},
{id:"fp",  name:"Future Perfect",  c1:"#c6ff00",c2:"#00e676",d:"Actions finished before a time in the future.",ex:"She will have played football by Friday.",t:["by tomorrow evening","by next Friday","by the end of the year"],f:(s,v)=>"will have "+v[4]},
{id:"fpc", name:"Future Perfect Continuous",c1:"#ff1744",c2:"#d500f9",d:"How long an action will have lasted by a future time.",ex:"He will have been playing for two hours by noon.",t:["for two hours by noon tomorrow","for a year by next June","for ten years by 2030"],f:(s,v)=>"will have been "+v[2]},
/* ---- MIXED TENSES: two tenses in one sentence. The blank is one of them, the time clause already shows the other ---- */
{id:"pcs", name:"Past Continuous + Past Simple",c1:"#ff7a00",c2:"#ff2bd6",d:"A long action interrupted by a short action.",ex:"She was playing football when the phone rang.",t:[],cl:[{x:"when the phone ___ (ring)",a:"rang",w:["rings","has rung","was ringing"]},{x:"when the teacher ___ (come) in",a:"came",w:["comes","has come","was coming"]},{x:"when it ___ (start) to rain",a:"started",w:["starts","has started","was starting"]},{x:"when the lights ___ (go) out",a:"went",w:["goes","has gone","was going"]}],f:(s,v)=>was(s)+" "+v[2]},
{id:"pps", name:"Past Simple + Past Perfect",c1:"#7dff3a",c2:"#00c2ff",d:"Two past actions: the first one was already finished.",ex:"She watched TV after she had finished the homework.",t:[],cl:[{x:"after the guests ___ (leave)",a:"had left",w:["left","have left","were leaving"]},{x:"after the rain ___ (stop)",a:"had stopped",w:["stopped","has stopped","was stopping"]},{x:"after the bell ___ (ring)",a:"had rung",w:["rang","has rung","was ringing"]},{x:"after the film ___ (end)",a:"had ended",w:["ended","has ended","was ending"]}],f:(s,v)=>v[3]},
{id:"fsps",name:"Future Simple + Present Simple",c1:"#00d9ff",c2:"#b44cff",d:"First conditional: if + present, will + verb.",ex:"He will play football if it does not rain.",t:[],cl:[{x:"if it ___ (rain) tomorrow",a:"rains",w:["will rain","rained","is raining"]},{x:"if the teacher ___ (agree)",a:"agrees",w:["will agree","agreed","is agreeing"]},{x:"if the weather ___ (be) good",a:"is",w:["will be","was","has been"]},{x:"if the shop ___ (open) early",a:"opens",w:["will open","opened","is opening"]}],f:(s,v)=>"will "+v[0]},
{id:"ppps",name:"Present Perfect + Past Simple",c1:"#ff3d71",c2:"#ffb400",d:"Since + a finished past moment: the action continues until now.",ex:"She has played football since she moved here.",t:[],cl:[{x:"since the school ___ (open)",a:"opened",w:["opens","has opened","was opening"]},{x:"since the class ___ (begin)",a:"began",w:["begins","has begun","was beginning"]},{x:"since the club ___ (start)",a:"started",w:["starts","has started","was starting"]},{x:"since the shop ___ (close)",a:"closed",w:["closes","has closed","was closing"]}],f:(s,v)=>has(s)+" "+v[4]},
{id:"cn2", name:"Second Conditional",c1:"#ffd400",c2:"#ff2b6b",d:"Unreal present: if + past simple, would + verb.",ex:"She would play football if she had time.",t:[],cl:[{x:"if she ___ (have) time",a:"had",w:["has","will have","would have"]},{x:"if the weather ___ (be) warmer",a:"were",w:["is","will be","would be"]},{x:"if they ___ (know) the answer",a:"knew",w:["know","will know","would know"]},{x:"if the shop ___ (open) earlier",a:"opened",w:["opens","will open","would open"]}],f:(s,v)=>"would "+v[0]},
{id:"cn3", name:"Third Conditional",c1:"#b44cff",c2:"#00e5ff",d:"Unreal past: if + past perfect, would have + past participle.",ex:"He would have played football if he had had time.",t:[],cl:[{x:"if the weather ___ (be) better",a:"had been",w:["was","has been","would have been"]},{x:"if she ___ (know) the answer",a:"had known",w:["knew","has known","would have known"]},{x:"if we ___ (leave) earlier",a:"had left",w:["left","have left","would have left"]},{x:"if the bus ___ (come) on time",a:"had come",w:["came","has come","would have come"]}],f:(s,v)=>"would have "+v[4]},
{id:"fst", name:"Future Simple + Time Clause",c1:"#39ff88",c2:"#ff9a00",d:"Will + verb, but present simple after when, after, before.",ex:"He will play football after the lesson finishes.",t:[],cl:[{x:"when the teacher ___ (arrive)",a:"arrives",w:["will arrive","arrived","is arriving"]},{x:"after the lesson ___ (finish)",a:"finishes",w:["will finish","finished","is finishing"]},{x:"before the bus ___ (leave)",a:"leaves",w:["will leave","left","is leaving"]},{x:"as soon as the rain ___ (stop)",a:"stops",w:["will stop","stopped","is stopping"]}],f:(s,v)=>"will "+v[0]},
{id:"pcps",name:"Past Perfect Continuous + Past Simple",c1:"#ff6ec7",c2:"#ffe600",d:"A long action in progress, then a past event happened.",ex:"She had been playing for two hours before the rain stopped.",t:[],cl:[{x:"for two hours before the rain ___ (stop)",a:"stopped",w:["stops","has stopped","was stopping"]},{x:"all day before the teacher ___ (come)",a:"came",w:["comes","has come","was coming"]},{x:"for a long time before the match ___ (start)",a:"started",w:["starts","has started","was starting"]},{x:"for an hour before the bell ___ (ring)",a:"rang",w:["rings","has rung","was ringing"]}],f:(s,v)=>"had been "+v[2]}
];
TENSES.forEach((T,i)=>T.seed=i+1);   // gives every tense its own question order
/* STRUCTURE shown on the home cards (S = subject, V1 = base verb, V2 = past, V3 = past participle) */
const STRUCT={ps:"S + V1 / V-s",pc:"S + am/is/are + V-ing",pas:"S + V2",pac:"S + was/were + V-ing",pp:"S + have/has + V3",fs:"S + will + V1",ppc:"S + have/has + been + V-ing",pap:"S + had + V3",papc:"S + had been + V-ing",fc:"S + will be + V-ing",fp:"S + will have + V3",fpc:"S + will have been + V-ing",
 pcs:"S + was/were + V-ing + when + S + V2",pps:"S + V2 + after + S + had + V3",fsps:"S + will + V1 + if + S + V-s/V1",ppps:"S + have/has + V3 + since + S + V2",cn2:"S + would + V1 + if + S + V2",cn3:"S + would have + V3 + if + S + had + V3",fst:"S + will + V1 + when + S + V-s/V1",pcps:"S + had been + V-ing + before + S + V2"};
TENSES.forEach(T=>T.st=(STRUCT[T.id]||"").replace(/\bS\b/g,"Sub"));   // S = subject, shown as "Sub"
const stHTML=T=>T.st.split(" + ").map(t=>`<b class="sp ${t=="Sub"?"s":/^(when|if|after|since|before)$/.test(t)?"k":"v"}">${t}</b>`).join("<i>+</i>");   // structure as coloured blocks
// Tenses that can BOTH be right in the same sentence never appear together as options:
const CLASH={pap:["pas","pac","papc"],papc:["pap","pac","pas"],ppc:["pp"],fs:["fc","fp"],fp:["fpc","fs"],fpc:["fp"],pcs:["pas","pap","papc"],pps:["pap","pac","papc"],fsps:["ps","fc","fp","fpc"],ppps:["ppc"],fst:["fc","fp","fpc"],pcps:["pap","pac","pas","pp"]};
const clash=(a,b)=>(CLASH[a.id]||[]).includes(b.id)||(CLASH[b.id]||[]).includes(a.id);

/* ---------- 4. QUESTIONS ---------- */
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* HARDER EXAMS: wrong options are mostly the tenses students confuse with the right one (its "neighbours") */
const NEAR={ps:["pc","pp","pas"],pc:["ps","pac","fc"],pas:["pp","pac","pap"],pac:["pas","pc","papc"],pp:["pas","ppc","ps"],fs:["fc","fp","ps"],ppc:["pp","pc","papc"],pap:["pas","pp","papc"],papc:["pap","ppc","pac"],fc:["fs","pc","fpc"],fp:["fs","pp","fpc"],fpc:["fp","ppc","fc"],
 pcs:["pc","ps","pp"],pps:["pp","pc","ps"],fsps:["fc","fp","pc"],ppps:["pas","ps","pc"],cn2:["fs","ps","pas"],cn3:["pas","pp","pap"],fst:["ps","pc","fs"],pcps:["ppc","papc","pc"]};
function near(T,s,v,right,r,n){
  const pool=TENSES.filter(x=>x!==T&&!x.cl&&!clash(T,x)),nr=NEAR[T.id]||[];
  const f=l=>[...new Set(l.sort(()=>r()-.5).map(x=>x.f(s,v)))].filter(x=>x!==right);
  const a=f(pool.filter(x=>nr.includes(x.id))),b=f(pool.filter(x=>!nr.includes(x.id))).filter(x=>!a.includes(x));
  return [...a.slice(0,n-1),...b,...a.slice(n-1)].slice(0,n);
}
function mixedQ(T,s,v,i,r){                 // mixed tenses: TWO blanks, every option is a pair "first answer + second answer"
  const c=T.cl[i%T.cl.length],r1=T.f(s,v);
  const w1=near(T,s,v,r1,r,3);
  const w2=c.w.slice().sort(()=>r()-.5),pr=(a,b)=>a+" / "+b;
  const o=[pr(r1,c.a),pr(r1,w2[0]),pr(w1[0],c.a),pr(w1[1],w2[1])].sort(()=>r()-.5);
  return {q:`${s} ___ (${v[0]}) ${v[5]} ${c.x}.`,o,a:o.indexOf(pr(r1,c.a))};
}
function build(T,run){                       // returns TOTAL questions: {q, o:[options], a:index of correct}
  const rnd=mulberry(T.seed*977+run),list=[];
  for(let i=0;i<TOTAL;i++){
    const s=SUBJECTS[(i+T.seed)%SUBJECTS.length], v=VERBS[(i*7+T.seed)%VERBS.length], right=T.f(s,v);
    if(T.cl){list.push(mixedQ(T,s,v,i,rnd));continue}
    const wrong=near(T,s,v,right,rnd,3);
    const options=[right,...wrong].sort(()=>rnd()-.5);
    list.push({q:`${s} ___ (${v[0]}) ${v[5]} ${T.t[i%T.t.length]}.`,o:options,a:options.indexOf(right)});
  }
  return list;
}

/* ---------- 5. TIMER (seven-segment display) ---------- */
const SEGS={0:"abcdef",1:"bc",2:"abdeg",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
const SHAPE={a:"10,4 50,4 44,12 16,12",b:"52,6 52,46 44,42 44,14",c:"52,54 52,94 44,86 44,58",d:"10,96 50,96 44,88 16,88",e:"8,54 16,58 16,86 8,94",f:"8,6 16,14 16,42 8,46",g:"10,50 16,45 44,45 50,50 44,55 16,55"};
const digit=n=>`<svg class="sg" viewBox="0 0 60 100">`+Object.keys(SHAPE).map(k=>`<polygon points="${SHAPE[k]}" class="${SEGS[n].includes(k)?"on":""}"/>`).join("")+`</svg>`;
const clock=t=>{const m=Math.floor(t/60),r=t%60;return digit(Math.floor(m/10))+digit(m%10)+`<span class="colon"><i></i><i></i></span>`+digit(Math.floor(r/10))+digit(r%10)};
const timerColor=left=>left<=RED_AT?"low":left<=YELLOW_AT?"mid":"";      // "" = green
const secLeft=()=>Math.max(0,Math.ceil((S.end-Date.now())/1000));

/* ---------- 6. SCREENS ---------- */
const app=document.getElementById("app");
let S=null;                                      // the current exam (null = home page)
const pad=n=>String(n).padStart(2,"0");
const cv=T=>`--c1:${T.c1};--c2:${T.c2}`;
const best=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const pageOf=i=>Math.floor(i/CONFIG.perPage);
const pageNums=[...Array(CONFIG.pages).keys()];

function nextLogo(img){                 // try the next picture name, or show the letters
  const i=+img.dataset.i+1;
  if(i<CONFIG.logoImages.length){img.dataset.i=i;img.src=CONFIG.logoImages[i]}
  else img.replaceWith(CONFIG.logoLetter);
}

  if(S)clearInterval(S.timer);S=null;

  <header class="nav"><div class="brand"><span class="logo"><img src="${CONFIG.logoImages[0]}" data-i="0" alt="" onerror="nextLogo(this)"></span><b>${CONFIG.brand}</b></div><span class="navtag">${CONFIG.navLabel}</span></header>
  <div class="hero">

    <div class="cta"><div class="roles"><button class="role st" data-a="tologin"><i>🎓</i><b>Student</b><small>Log in with name + code</small></button><button class="role te" data-a="toteacher"><i>🧑‍🏫</i><b>Teacher</b><small>Create groups &amp; exams</small></button></div></div>

  </div>

    return `<button class="tc" style="${cv(T)};--d:${(k%2)*140}ms" data-n="${pad(k+1)}" data-a="open" data-id="${T.id}"><i class="shine"></i><small>Tense ${k+1}</small><h2>${T.name}</h2><p>${T.d}</p><em><span class="stl">Structure</span><span class="sf">${stHTML(T)}</span></em><div class="row"><span>${b?"Best score "+b+"/"+TOTAL:TOTAL+" questions"}</span><span class="go">Start</span></div></button>`}).join("")+`</div><p class="none" id="none" hidden>No tenses found. Try another word.</p>`;

function introScreen(){            // the screen with the Start button and page picker
  const T=S.T,sel=S.sel,fresh=S.fresh;S.fresh=false;
  const pick=(v,label,small)=>`<button class="pk ${sel===v?"on":""}" data-a="sel" data-v="${v}"><b>${label}</b><small>${small}</small></button>`;

   ?[`${TOTAL} questions on ${CONFIG.pages} pages, ${CONFIG.perPage} per page`,`You have ${MINUTES} minutes for each page`,"When time is up, the next page opens by itself","The exam ends when time runs out on the last page, or when you answer every question on it","You cannot go back to a finished page","After each answer you see if it is correct or wrong"]
   :[`${CONFIG.perPage} questions on page ${sel+1}`,`You have ${MINUTES} minutes for this page`,"The exam ends when time is up, or when you answer every question","After each answer you see if it is correct or wrong"];

  <span class="cta-wrap"><button class="cta-btn start-btn" data-a="start"><span class="st"><b>${sel=="all"?"Start Full Exam":"Start Page "+(sel+1)}</b><small>${sel=="all"?TOTAL+" questions · "+MINUTES+" min per page":CONFIG.perPage+" questions · "+MINUTES+" min"}</small></span><span class="cta-a">→</span></button></span></div></div>`;
}

function examScreen(){
  if(!S.started)return introScreen();
  const {T,p,Q,ans,done}=S, tot=S.list.length*CONFIG.perPage, cnt=Object.keys(ans).length;
  const left=done?S.left:secLeft(), first=S.list[0];
  let h=`<div class="top" style="${cv(T)}"><div class="th"><button class="ghost" data-a="home">← Home</button>
    <div style="flex:1;min-width:0"><b>${T.name}</b><br><small>Page ${p+1} of ${CONFIG.pages} · Questions ${p*CONFIG.perPage+1}–${(p+1)*CONFIG.perPage}</small></div>
    ${S.group&&!done?`<button class="btn p" data-a="submit">Finish exam</button>`:""}</div>
    <div class="bar"><i style="width:${cnt/tot*100}%"></i></div><div class="pct">${cnt}/${tot} answered · ${MINUTES} minutes per page</div></div>
    <div style="${cv(T)}">${S.note&&!done?`<div class="note">${S.note}</div>`:""}`;
  if(done){                                       // result box
    const sc=scoreOf();
    h+=`<div class="res"><div class="ring" style="--p:${sc/tot*100}"><div><span>${sc}<small>out of ${tot}</small></span></div></div>
    <h3>${S.timeout?"Time is up! ":""}${sc>=tot*.9?"Excellent work!":sc>=tot*.7?"Great job!":sc>=tot*.5?"Good effort!":"Keep practising!"}</h3>
    <span style="color:var(--mut)">Review your answers below: green is correct, red is your mistake.</span>
    ${S.sent?`<div class="sent">${S.sent}</div>`:""}<div class="b">${S.group?"":`<button class="btn p" data-a="retry">Try again</button><button class="btn" data-a="home">Other tenses</button>`}</div></div>`;
  }
  for(let k=0;k<CONFIG.perPage;k++){              // the questions of this page
    const n=p*CONFIG.perPage+k,q=Q[n],a=ans[n],show=done||a!==undefined;
    h+=`<section class="q" style="animation-delay:${k*40}ms"><p><span class="n">${n+1}</span>${q.q.replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</p><div class="opts">`+
    q.o.map((o,j)=>{let c=show?(j==q.a?"ok":a===j?"bad":"")+" lock":"";
      return `<button class="opt ${c}" data-a="pick" data-n="${n}" data-j="${j}"><span class="l">${"ABCD"[j]}</span>${o}</button>`}).join("")+`</div>`+
    (show?`<div class="fb ${a===q.a?"good":"no"}">${a===undefined?"Not answered. Correct answer: "+q.o[q.a]:a===q.a?"Correct! Well done.":"Wrong. The correct answer is: "+q.o[q.a]}</div>`:"")+`</section>`;
  }
  h+=`<div class="foot${done?" done":""}"><span></span><div class="dots">`+
    S.list.map(i=>{const full=done?[...Array(CONFIG.perPage).keys()].every(k=>ans[i*CONFIG.perPage+k]!==undefined):i<p;
      return `<button class="btn dot ${i==p?"on":full?"full":done?"":"todo"}" ${done?`data-a="go" data-p="${i}"`:'tabindex="-1"'}>${i+1}</button>`}).join("")+`</div>`+
    `<div class="ck"><div id="clk2" class="clock ${timerColor(left)}">${clock(left)}</div><button class="btn" data-a="home">← Home</button></div>`+
    (!done&&p<S.last?`<button class="btn p" data-a="next">Next →</button>`:"")+
    (S.group&&!done?`<button class="btn p" data-a="submit">Finish</button>`:"")+`</div></div>`;
  app.innerHTML=h;
}

/* ---------- 7. ACTIONS ---------- */
const scoreOf=()=>S.Q.reduce((x,q,i)=>x+(S.list.includes(pageOf(i))&&S.ans[i]===q.a?1:0),0);

function openExam(id,run,sel){                    // go to the start screen of a tense
  const T=TENSES.find(x=>x.id==id);if(!T)return homeScreen();
  if(S)clearInterval(S.timer);
  S={T,run:run||0,sel:sel===undefined?"all":sel,p:0,ans:{},done:false,started:false,fresh:true};
  S.Q=build(T,S.run);examScreen();scrollTo(0,0);
}
function startExam(){
  S.list=S.sel=="all"?pageNums:[S.sel];S.last=S.list[S.list.length-1];S.p=S.list[0];
  S.started=true;S.end=Date.now()+SECS*1000;S.timer=setInterval(tick,250);examScreen();scrollTo(0,0);
}
function tick(){                                   // runs 4 times a second while the timer is on
  if(!S||S.done)return;
  const l=secLeft();
  ["clk","clk2"].forEach(id=>{const c=document.getElementById(id);   // top clock + clock next to Next/Submit
    if(c){c.innerHTML=clock(l);c.classList.toggle("low",l<=RED_AT);c.classList.toggle("mid",l>RED_AT&&l<=YELLOW_AT)}});
  if(l<=0)nextPage(true);
}
function nextPage(timeUp){                         // go to next page, or finish after the last one
  if(S.p<S.last){S.note=timeUp?`Time is up for page ${S.p+1}. Page ${S.p+2} has started.`:"";S.p++;S.end=Date.now()+SECS*1000;examScreen();scrollTo(0,0)}
  else{S.timeout=timeUp;finishExam()}
}
function autoFinish(){                             // last page fully answered -> end the exam after a short pause (so you still see the last answer)
  if(S.done||S.fin||S.p!==S.last)return;
  const base=S.last*CONFIG.perPage;
  if(![...Array(CONFIG.perPage).keys()].every(k=>S.ans[base+k]!==undefined))return;
  S.fin=true;S.note="All questions answered. Finishing the exam…";const me=S;
  setTimeout(()=>{if(S===me&&!S.done)finishExam()},1500);
}
function finishExam(){

const ALPH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
/* The code itself carries the exam: 12 bits = tenses, 3 bits = page, 15 bits = random. Any device can read it, no database needed. */
function mkExamCode(ids,page){
  let mask=0,ext=0;TENSES.forEach((t,i)=>{if(ids.includes(t.id)){if(i<12)mask|=1<<i;else ext|=1<<(i-12)}});
  const pv=page=="all"?7:+page,n=((mask<<18)|(pv<<15)|(ext<<7)|Math.floor(Math.random()*128))>>>0;
  let c="";for(let i=5;i>=0;i--)c+=ALPH[(n>>>(i*5))&31];return c;
}
function readExamCode(c){
  if(!/^[A-HJ-NP-Z2-9]{6}$/.test(c))return null;
  let n=0;for(const ch of c)n=n*32+ALPH.indexOf(ch);
  const mask=Math.floor(n/262144)&4095,pv=Math.floor(n/32768)&7,ext=Math.floor(n/128)&255;
  if((!mask&&!ext)||(pv>4&&pv!=7))return null;
  return {code:c,name:"Class exam",tenses:TENSES.filter((t,i)=>i<12?mask&(1<<i):ext&(1<<(i-12))).map(t=>t.id),page:pv==7?"all":pv,created:0,closed:false};
}
const mkCode=()=>{const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s};

function buildGroup(g,ts){            // same code = same questions for every student of the group
  const r=mulberry(ghash(g.code)),list=[];
  for(let i=0;i<TOTAL;i++){
    const t=ts[i%ts.length],s=SUBJECTS[Math.floor(r()*SUBJECTS.length)],v=VERBS[Math.floor(r()*VERBS.length)],right=t.f(s,v);
    if(t.cl){list.push(mixedQ(t,s,v,i,r));continue}
    const wrong=near(t,s,v,right,r,3);
    const o=[right,...wrong].sort(()=>r()-.5);
    list.push({q:`${s} ___ (${v[0]}) ${v[5]} ${t.t[Math.floor(r()*t.t.length)]}.`,o,a:o.indexOf(right)});
  }
  return list;
}

    const box=card.querySelector(".rbox");clearInterval(resTimer);
    if(hit.length){
      box.innerHTML=`<p class="meta">Found ${hit.length} for “${gesc(nm.trim())}”</p><table class="gtab"><tr><th>Student</th><th>Score</th><th>%</th><th>Time left</th><th>Finished</th></tr>${hit.map(x=>`<tr><td>${gesc(x.name)}</td><td>${x.score}/${x.total}</td><td>${Math.round(x.score/x.total*100)}%</td><td>${typeof x.left=="number"?pad(Math.floor(x.left/60))+":"+pad(x.left%60):"–"}</td><td>${x.at?new Date(x.at).toLocaleString():"–"}</td></tr>`).join("")}</table><button class="ghost" data-a="tres" style="margin-top:10px">Show all students</button>`;
      return}
    const g0=await store.group(code),total=((g0&&g0.page)=="all"||!g0?CONFIG.pages:1)*CONFIG.perPage;
    if(!await askBox("No result found for “"+nm.trim()+"” on this device"+(CLOUD?" or online":"")+". The student's score is not here yet. Enter it by hand?",{ok:"Enter score",cancel:"Close"}))return;
    const v=await resultBox(total,nm.trim());if(!v)return;
    try{
      let name,score,tot,left;
      if(v.code){const x=b64d(v.code.trim());if(x.c!=code||!x.n)throw 0;name=String(x.n);score=+x.s;tot=+x.t;left=x.l===undefined?undefined:+x.l}
      else{name=v.name;score=v.score;tot=v.total}
      await store.saveResult({key:code+"_"+ghash(name.toLowerCase()).toString(36),code,name,score,total:tot,left,at:Date.now()});
      card.querySelector('[data-a=tres]').click()}
    catch(e){askBox("This result code is not valid for this group.",{ok:"OK",cancel:"Close"})}
  }
  else if(a=="tres"){showResults(card,code);clearInterval(resTimer);resTimer=setInterval(()=>{if(!document.body.contains(card))clearInterval(resTimer);else showResults(card,code)},3000)}
}
/* ---- teacher: add a result by typing the student's name + score (or paste a result code) ---- */
function resultBox(total,pre){
  return new Promise(res=>{
    const w=document.createElement("div");w.className="mbk";
    w.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>Add a student's result</p>
    <label class="l" for="rbn">Student name (same name the student types)</label><input class="fld" id="rbn" autocomplete="off" placeholder="Student name" value="${gesc(pre||"")}">
    <div style="display:flex;gap:10px"><div style="flex:1"><label class="l" for="rbs">Score</label><input class="fld" id="rbs" type="number" inputmode="numeric" min="0" max="${total}" placeholder="0"></div>
    <div style="flex:1"><label class="l" for="rbt">Out of</label><input class="fld" id="rbt" type="number" inputmode="numeric" min="1" value="${total}"></div></div>
    <label class="l" for="rbc">Or paste a result code instead</label><input class="fld" id="rbc" autocomplete="off" spellcheck="false" placeholder="Result code (optional)">
    <div class="meta" id="rbe" style="color:var(--bad);min-height:1.2em;margin:-6px 0 12px"></div>
    <div class="mbtn"><button class="btn" data-m="0">Cancel</button><button class="btn p" data-m="1">Add</button></div></div>`;
    document.body.appendChild(w);
    const q=i=>w.querySelector("#"+i),done=v=>{w.remove();document.removeEventListener("keydown",kd,true);res(v)};
    const submit=()=>{
      const c=q("rbc").value.trim();if(c){done({code:c});return}
      const name=q("rbn").value.trim().replace(/\s+/g," "),sc=q("rbs").value.trim(),tt=q("rbt").value.trim(),e=q("rbe");
      if(!name){e.textContent="Enter the student's name.";q("rbn").focus();return}
      if(sc===""||!/^\d+$/.test(sc)){e.textContent="Enter the score as a whole number.";q("rbs").focus();return}
      if(!/^\d+$/.test(tt)||+tt<1){e.textContent="Enter the total number of questions.";q("rbt").focus();return}
      if(+sc>+tt){e.textContent="The score cannot be higher than the total.";q("rbs").focus();return}
      done({name,score:+sc,total:+tt});
    };
    const kd=e=>{if(e.key=="Escape"){e.preventDefault();done(null)}else if(e.key=="Enter"){e.preventDefault();submit()}};
    w.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){if(m.dataset.m=="1")submit();else done(null)}else if(e.target===w)done(null)});
    document.addEventListener("keydown",kd,true);q("rbn").focus();
  });
}
/* ---- question box inside the page (browser pop-ups such as confirm() are blocked in many phone apps) ---- */
function askBox(msg,o){
  o=o||{};const input=!!o.input;
  return new Promise(res=>{
    const w=document.createElement("div");w.className="mbk";
    w.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${gesc(msg)}</p>${input?`<input class="fld" id="mbin" placeholder="${gesc(o.ph||"")}" autocomplete="off" spellcheck="false">`:""}<div class="mbtn"><button class="btn" data-m="0">${gesc(o.cancel||"Cancel")}</button><button class="btn p" data-m="1">${gesc(o.ok||"OK")}</button></div></div>`;
    document.body.appendChild(w);
    const val=()=>input?w.querySelector("#mbin").value:true,no=input?null:false;
    const done=v=>{w.remove();document.removeEventListener("keydown",kd,true);res(v)};
    const kd=e=>{if(e.key=="Escape"){e.preventDefault();done(no)}else if(e.key=="Enter"&&input){e.preventDefault();done(val())}};
    w.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m)done(m.dataset.m=="1"?val():no);else if(e.target===w)done(no)});
    document.addEventListener("keydown",kd,true);
    (w.querySelector("#mbin")||w.querySelector("[data-m='1']")).focus();
  });
}
let resTimer=null;
/* ---- teacher phone alert: while the Teacher page is open, a message pops up (with sound + vibration) every time a student finishes ---- */
const seen={};
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.innerHTML=msg;document.body.appendChild(t);
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(c.currentTime+.18)}catch(e){}
  setTimeout(()=>t.remove(),6000);
}
async function watchResults(){
  if(!document.querySelector(".gcard"))return;                 // only on the Teacher page
  const gs=await store.groups();
  for(const g of gs){
    const r=await store.results(g.code),k=g.code,first=!(k in seen);
    if(!first){const old=seen[k];r.filter(x=>!old.has(x.key)).forEach(x=>toast("✔ <b>"+gesc(x.name)+"</b> finished "+gesc(g.name)+": "+x.score+"/"+x.total+" ("+Math.round(x.score/x.total*100)+"%)"))}
    seen[k]=new Set(r.map(x=>x.key));
  }
  document.querySelectorAll(".gcard").forEach(c=>{const b=c.querySelector(".rbox table");if(b&&seen[c.dataset.c])showResults(c,c.dataset.c)});
}
setInterval(()=>{watchResults().catch(()=>{})},4000);
store.purgeOrphans();
async function showResults(card,code){          // draws the table; repeats every 3 s while open = live results
  const r=await store.results(code),box=card.querySelector(".rbox");if(!box)return;
  box.innerHTML=`<p class="meta">● Live${CLOUD?"":" (this device only. Turn on Online sync to see other devices)"} · ${r.length} finished</p>`+(r.length?`<table class="gtab"><tr><th>#</th><th>Student</th><th>Score</th><th>%</th><th>Time left</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${gesc(x.name)}</td><td>${x.score}/${x.total}</td><td>${Math.round(x.score/x.total*100)}%</td><td>${typeof x.left=="number"?pad(Math.floor(x.left/60))+":"+pad(x.left%60):"–"}</td></tr>`).join("")}</table>`:`<p class="meta">No student has finished yet.</p>`);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
  if(a=="tologin")nav("login");
  else if(a=="toteacher")nav("teacher");
  else if(a=="glogin")doLogin();
  else if(/^t(all|none|make|res|close|del|link|copy|cloudsave|import)$/.test(a))teacherAction(a,b);
});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.id=="gcode")doLogin()});

function route(){const id=location.hash.slice(1);if(id.startsWith("join=")){try{JOIN=b64d(id.slice(5));if(JOIN.d){CLOUD=JOIN.d.replace(/\/+$/,"");LSg.set("ce_cloud",CLOUD)}}catch(e){JOIN=null}loginScreen()}else if(id=="teacher")teacherScreen();else if(id=="login")loginScreen();else id?openExam(id):homeScreen()}   // #teacher, #login, #ps = Present Simple, empty = home
addEventListener("hashchange",route);route();
</script></body></html>
